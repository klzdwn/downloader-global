    <!-- Main Content -->
    <main class="w-full max-w-xl my-auto z-10 flex flex-col gap-6">

        <!-- Hero Section -->
        <div class="text-center space-y-3">
            <span id="heroBadge" class="text-xs font-bold tracking-widest text-purple-600 dark:text-purple-400 uppercase px-3 py-1 bg-purple-500/10 rounded-full border border-purple-500/20">
                Multi-Platform Global Downloader
            </span>
            <h1 class="text-3xl sm:text-4xl font-extrabold text-gray-900 dark:text-white leading-tight">
                <span id="heroTitle1">Download Video & Foto</span> <br>
                <span id="heroTitle2" class="bg-clip-text text-transparent bg-gradient-to-r from-purple-600 via-pink-500 to-indigo-600 dark:from-purple-400 dark:via-pink-400 dark:to-indigo-400">
                    Tanpa Watermark HD
                </span>
            </h1>
            <p id="heroSubtitle" class="text-xs text-gray-600 dark:text-gray-400 max-w-md mx-auto">
                Unduh konten dari TikTok, Instagram, YouTube, Twitter/X, Pinterest & platform global lainnya secara instan.
            </p>
        </div>

        <!-- Input Box Form -->
        <div id="inputCard" class="glass-card p-4 sm:p-5 rounded-2xl glow-effect space-y-3">
            <form id="downloadForm" class="flex flex-col gap-3">
                <div class="relative flex items-center">
                    <i class="fa-solid fa-link absolute left-4 text-gray-400 text-sm"></i>
                    <input 
                        type="url" 
                        id="urlInput" 
                        placeholder="Tempel tautan video/foto di sini..." 
                        required
                        class="w-full bg-gray-100/80 dark:bg-gray-900/90 text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 text-sm rounded-xl pl-11 pr-20 py-3.5 border border-gray-200 dark:border-gray-700/50 focus:outline-none focus:border-purple-500 transition-all"
                    >
                    <button 
                        type="button" 
                        id="pasteBtn"
                        class="absolute right-2 text-xs font-medium bg-purple-100 hover:bg-purple-200 dark:bg-gray-800 dark:hover:bg-gray-700 text-purple-700 dark:text-purple-300 px-3 py-1.5 rounded-lg border border-purple-200 dark:border-purple-500/20 transition-all flex items-center gap-1"
                    >
                        <i class="fa-regular fa-clipboard"></i> <span id="pasteBtnText">Paste</span>
                    </button>
                </div>

                <button 
                    type="submit" 
                    id="btnSubmit"
                    class="w-full py-3.5 bg-gradient-to-r from-purple-600 via-indigo-600 to-purple-700 text-white font-bold rounded-xl shadow-lg glow-btn transition-all duration-300 flex items-center justify-center gap-2 active:scale-95"
                >
                    <i class="fa-solid fa-arrow-down"></i> <span id="btnSubmitText">Process Media</span>
                </button>
            </form>

            <!-- Loading State -->
            <div id="loadingState" class="hidden py-4 text-center space-y-2">
                <div class="inline-block w-7 h-7 border-3 border-purple-500 border-t-transparent rounded-full animate-spin"></div>
                <p id="loadingText" class="text-xs text-gray-500 dark:text-gray-400">Sedang mengekstrak media dari server...</p>
            </div>
        </div>

        <!-- Result Card -->
        <div id="resultCard" class="hidden glass-card p-4 sm:p-5 rounded-2xl space-y-4">
            <div class="flex items-center justify-between pb-3 border-b border-gray-200/80 dark:border-gray-800">
                <span id="mediaFoundLabel" class="text-xs font-semibold text-emerald-600 dark:text-emerald-400 flex items-center gap-1.5">
                    <i class="fa-solid fa-circle-check"></i> Media Ditemukan
                </span>
                <span class="text-[10px] bg-gray-200/70 dark:bg-gray-800 text-gray-700 dark:text-gray-300 px-2.5 py-0.5 rounded-md font-mono" id="mediaSourceTag">Public</span>
            </div>

            <!-- Media Preview Container Adaptif Tema -->
            <div id="previewContainer" class="relative rounded-xl overflow-hidden bg-gray-100/80 dark:bg-black/60 border border-gray-200/80 dark:border-gray-800 min-h-[220px] flex items-center justify-center transition-colors">
                <!-- Diisi via JS -->
            </div>

            <!-- Meta Info Badges -->
            <div id="mediaMetaInfo" class="grid grid-cols-3 gap-2 py-1">
                <!-- Diisi via JS -->
            </div>

            <!-- Title Info -->
            <p id="mediaTitle" class="text-xs text-gray-800 dark:text-gray-200 font-medium line-clamp-2 leading-relaxed">
                Judul Media
            </p>

            <!-- Choice Resolution Selector -->
            <div id="resolutionBox" class="space-y-1.5 pt-1">
                <label id="qualityLabel" class="text-[11px] font-medium text-gray-600 dark:text-gray-400 flex items-center gap-1">
                    <i class="fa-solid fa-sliders text-purple-500"></i> Pilih Kualitas / Resolusi:
                </label>
                <div id="resolutionSelectorContainer"></div>
            </div>

            <!-- Download Action & Progress Bar -->
            <div class="space-y-3 pt-2">
                <!-- Progress Container -->
                <div id="progressBox" class="hidden space-y-1.5">
                    <div class="flex justify-between text-xs">
                        <span id="progressStatus" class="text-purple-600 dark:text-purple-400 font-medium">Proses Unduh...</span>
                        <span id="progressPercent" class="text-gray-900 dark:text-white font-bold">0%</span>
                    </div>
                    <div class="w-full bg-gray-200 dark:bg-gray-800 h-2.5 rounded-full overflow-hidden p-0.5 border border-gray-300 dark:border-gray-700">
                        <div id="progressBar" class="bg-gradient-to-r from-purple-500 via-pink-500 to-emerald-400 h-full w-0% rounded-full transition-all duration-200"></div>
                    </div>
                </div>

                <!-- Tombol Unduh Utama -->
                <button 
                    id="downloadBtn" 
                    class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-xl transition-all flex items-center justify-center gap-2 active:scale-95 shadow-lg shadow-emerald-900/20"
                >
                    <i class="fa-solid fa-download"></i> <span id="downloadBtnText">Unduh Video</span>
                </button>

                <!-- Tombol Kembali -->
                <button 
                    id="backBtn" 
                    type="button"
                    class="w-full py-2.5 bg-gray-200/80 hover:bg-gray-300/80 dark:bg-gray-800/80 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-300 text-xs font-semibold rounded-xl border border-gray-300/60 dark:border-gray-700/60 transition-all flex items-center justify-center gap-2 active:scale-95"
                >
                    <i class="fa-solid fa-arrow-left"></i> <span id="backBtnText">Kembali & Tempel Link Lain</span>
                </button>
            </div>
        </div>

    </main>
